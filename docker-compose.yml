# Run with: docker compose --env-file FinaceManager/.env up -d --build
# Every configurable value comes from FinaceManager/.env; `:?` fails fast when one is missing.
services:
  db:
    image: mysql:8.4
    container_name: financemanager-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:?DATABASE_NAME missing in FinaceManager/.env}
      MYSQL_USER: ${DATABASE_USER:?DATABASE_USER missing in FinaceManager/.env}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD missing in FinaceManager/.env}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?DATABASE_ROOT_PASSWORD missing in FinaceManager/.env}
      TZ: ${DB_TIMEZONE:?DB_TIMEZONE missing in FinaceManager/.env}
    # Not published to the host; only the backend reaches it over the internal network.
    expose:
      - ${DATABASE_PORT:?DATABASE_PORT missing in FinaceManager/.env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financemanager-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY missing in FinaceManager/.env}
      DEBUG: ${DEBUG:?DEBUG missing in FinaceManager/.env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS missing in FinaceManager/.env}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: ${DATABASE_HOST:?DATABASE_HOST missing in FinaceManager/.env}
      DATABASE_PORT: ${DATABASE_PORT}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?DEFAULT_FROM_EMAIL missing in FinaceManager/.env}
      APP_PORT: ${APP_PORT:?APP_PORT missing in FinaceManager/.env}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:?WEB_CONCURRENCY missing in FinaceManager/.env}
    # Only the web proxy is published; the backend is reachable through it.
    expose:
      - ${APP_PORT}
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import os, socket; socket.create_connection(('127.0.0.1', int(os.environ['APP_PORT'])), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  web:
    image: nginx:1.27-alpine
    container_name: financemanager-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      APP_PORT: ${APP_PORT}
    ports:
      - "${HOST_PORT:?HOST_PORT missing in FinaceManager/.env}:80"
    volumes:
      - ./docker/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - static_files:/srv/static:ro

volumes:
  db_data:
  static_files:
  media_files:
